openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TopMart ERP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: batches
  - name: production-labels
  - name: workers
  - name: products
  - name: salary
  - name: payroll
  - name: customers
  - name: sales
  - name: inventory
  - name: vehicle-distribution

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: Healthy

  # ── Auth ──────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current session user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ─────────────────────────────────────────────────────────
  /dashboard/today:
    get:
      operationId: getDashboardToday
      tags: [dashboard]
      summary: Today's summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardToday"

  /dashboard/monthly:
    get:
      operationId: getDashboardMonthly
      tags: [dashboard]
      summary: Monthly summary
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMonthly"

  /dashboard/top-workers:
    get:
      operationId: getTopWorkers
      tags: [dashboard]
      summary: Top workers this month
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerStat"

  /dashboard/daily-chart:
    get:
      operationId: getDailyChart
      tags: [dashboard]
      summary: Daily production chart (last 30 days)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyChartPoint"

  # ── Batches ───────────────────────────────────────────────────────────
  /batches:
    get:
      operationId: getBatches
      tags: [batches]
      summary: List batches
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
        - name: worker
          in: query
          schema:
            type: ["string", "null"]
        - name: product
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchList"

  /batches/{id}:
    delete:
      operationId: deleteBatch
      tags: [batches]
      summary: Delete a batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /production-labels/{barcode}:
    get:
      operationId: getProductionLabel
      tags: [production-labels]
      summary: Look up one physical production label passport
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
            pattern: "^TM[A-Z2-7]{16}$"
      responses:
        "200":
          description: Label passport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionLabelPassport"
        "400":
          description: Invalid barcode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Workers ───────────────────────────────────────────────────────────
  /workers:
    get:
      operationId: getWorkers
      tags: [workers]
      summary: List all workers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"

    post:
      operationId: createWorker
      tags: [workers]
      summary: Add worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /workers/update:
    put:
      operationId: updateWorker
      tags: [workers]
      summary: Update worker (rename + edit fields)
      description: >-
        Identifies the worker by currentName in the body (not the URL) so that
        workers with names that are empty, ".", or contain "/" can still be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerUpdateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /workers/delete:
    post:
      operationId: deleteWorker
      tags: [workers]
      summary: Delete worker
      description: >-
        Identifies the worker by name in the body (not the URL) so that workers
        with names that are empty, ".", or contain "/" can still be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerDeleteInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Products ──────────────────────────────────────────────────────────
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

    post:
      operationId: createProduct
      tags: [products]
      summary: Add product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{name}:
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Salary ────────────────────────────────────────────────────────────
  /salary/report:
    get:
      operationId: getSalaryReport
      tags: [salary]
      summary: Monthly salary report
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryRow"

  /salary/pay:
    post:
      operationId: markSalaryPaid
      tags: [salary]
      summary: Mark worker salary as paid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalaryPayInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Payroll (rolga asoslangan kg maosh) ───────────────────────────────
  /payroll/role-rates:
    get:
      operationId: getPayrollRoleRates
      tags: [payroll]
      summary: List role rates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollRoleRate"
    put:
      operationId: updatePayrollRoleRate
      tags: [payroll]
      summary: Update a role rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollRoleRateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRoleRate"

  /payroll/workers:
    get:
      operationId: getKgPayrollWorkers
      tags: [payroll]
      summary: List assigned kg payroll workers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KgPayrollWorker"
    post:
      operationId: assignKgPayrollWorker
      tags: [payroll]
      summary: Assign a worker to the kg payroll pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KgPayrollWorkerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KgPayrollWorker"

  /payroll/workers/{id}:
    delete:
      operationId: removeKgPayrollWorker
      tags: [payroll]
      summary: Remove a kg payroll assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /payroll/worker-earnings:
    get:
      operationId: getPayrollWorkerEarnings
      tags: [payroll]
      summary: Per-worker today/month/lifetime earnings and kg
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollWorkerEarnings"

  /payroll/day-status:
    get:
      operationId: getPayrollDayStatus
      tags: [payroll]
      summary: Today's day-close status and producer volume
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollDayStatus"

  /payroll/lines:
    get:
      operationId: getProductionLines
      tags: [payroll]
      summary: List production lines
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionLine"
    post:
      operationId: createProductionLine
      tags: [payroll]
      summary: Create a production line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionLineInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionLine"

  /payroll/lines/{id}:
    delete:
      operationId: deleteProductionLine
      tags: [payroll]
      summary: Delete a production line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /payroll/lines/{id}/workers:
    post:
      operationId: addProductionLineWorker
      tags: [payroll]
      summary: Add a worker to a production line (enforces per-role limits)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionLineWorkerInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionLineWorker"

  /payroll/line-workers/{id}:
    delete:
      operationId: removeProductionLineWorker
      tags: [payroll]
      summary: Remove a worker from a production line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /payroll/close-day:
    post:
      operationId: closePayrollDay
      tags: [payroll]
      summary: Close today's payroll for all lines (idempotent per line+date)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollCloseResult"

  # ── Customers ─────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: getCustomers
      tags: [customers]
      summary: List customers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"

    post:
      operationId: createCustomer
      tags: [customers]
      summary: Add customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Sales ─────────────────────────────────────────────────────────────
  /sales:
    get:
      operationId: getSales
      tags: [sales]
      summary: List sales
      parameters:
        - name: customerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleList"

    post:
      operationId: createSale
      tags: [sales]
      summary: Create sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}:
    delete:
      operationId: deleteSale
      tags: [sales]
      summary: Delete sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sales/{id}/status:
    patch:
      operationId: updateSaleStatus
      tags: [sales]
      summary: Update sale payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleStatusInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Inventory ─────────────────────────────────────────────────────────
  /inventory:
    get:
      operationId: getInventory
      tags: [inventory]
      summary: Current inventory (produced minus sold)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  # ── Vehicle Distribution (F2 pilot) ───────────────────────────────────
  /vehicle-distribution/pilot:
    get:
      operationId: getVehicleDistributionPilot
      tags: [vehicle-distribution]
      summary: Read the pilot vehicle, warehouse balance summary and active assignment
      description: >-
        Authenticated read-only view of the single pilot vehicle (DM-001 / DAMAS),
        its home warehouse balance summary, and the active agent assignment.
        Fails closed (404) unless the vehicle-distribution feature is enabled, and
        returns 503 when enabled without schema approval. When the pilot has not
        been bootstrapped, returns a deterministic not-bootstrapped payload without
        performing any writes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDistributionPilot"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Enabled but schema not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicle-distribution/pilot/bootstrap:
    post:
      operationId: bootstrapVehicleDistributionPilot
      tags: [vehicle-distribution]
      summary: Idempotently create/reuse the pilot vehicle, warehouse and assignment
      description: >-
        Admin-only. Idempotently provisions the exact pilot state (agent NAVRUZBEK,
        vehicle DM-001 / DAMAS, one vehicle warehouse) and the single active
        assignment. All server constants are fixed; the request body carries no
        overridable fields. Retries and concurrent double-clicks return the same
        state with no duplicate rows.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleDistributionBootstrapInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDistributionPilot"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflicting or ambiguous existing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Enabled but schema not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicle-distribution/pilot/stock:
    get:
      operationId: getVehicleDistributionPilotStock
      tags: [vehicle-distribution]
      summary: Read the pilot vehicle warehouse stock cards (read model)
      description: >-
        Authenticated read-only stock view for the single pilot vehicle
        (DM-001 / DAMAS / agent NAVRUZBEK). The pilot vehicle and its expected
        vehicle warehouse are resolved entirely server-side — the request takes
        no vehicle or warehouse input. Fails closed (404) unless the
        vehicle-distribution feature is enabled, and returns 503 when enabled
        without schema approval. When the pilot has not been bootstrapped (no
        active NAVRUZBEK assignment on DM-001 with the exact expected vehicle
        warehouse), returns a deterministic not-bootstrapped payload
        (bootstrapped=false, null vehicle/warehouse, empty items, zeroed
        totals) and NEVER falls back to a generic warehouse. Stock items include
        only nonzero-quantity inventory rows (stock-card display semantics),
        sorted by product name.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDistributionPilotStock"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Enabled but schema not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicle-distribution/pilot/movements:
    get:
      operationId: getVehicleDistributionPilotMovements
      tags: [vehicle-distribution]
      summary: Read the pilot vehicle warehouse stock movements (read model)
      description: >-
        Authenticated read-only audit history of stock movements that touch the
        single pilot vehicle warehouse (either as source or destination). The
        pilot vehicle and its expected vehicle warehouse are resolved entirely
        server-side — the request takes no vehicle or warehouse input. Only rows
        where the pilot vehicle warehouse is the from OR to warehouse are ever
        returned; global movements and other-warehouse-only rows are never
        exposed. Ordered deterministically by id DESC and paginated via a
        keyset cursor (beforeId → nextBeforeId). Fails closed (404) unless the
        feature is enabled, 503 when enabled without schema approval. When the
        pilot has not been bootstrapped, returns a deterministic
        not-bootstrapped payload (bootstrapped=false, empty items, null
        nextBeforeId).
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of movements to return (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: beforeId
          in: query
          required: false
          description: >-
            Keyset cursor — return only movements with id strictly less than
            this positive integer. Omit for the first page.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDistributionPilotMovements"
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Enabled but schema not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicle-distribution/handoffs:
    get:
      operationId: listVehicleHandoffs
      tags: [vehicle-distribution]
      summary: List handoffs for the pilot vehicle
      description: >-
        Returns the prepared/lifecycle handoffs for the single active pilot
        vehicle (server-resolved). Authenticated via the dedicated
        vehicle-handoff auth wall (admin Bearer session OR the
        vehicle-distribution bot key). Fails closed (404) unless enabled, 503
        when enabled without schema approval.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleHandoffList"
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    post:
      operationId: createVehicleHandoff
      tags: [vehicle-distribution]
      summary: Create a prepared handoff for the pilot vehicle
      description: >-
        Creates a prepared (not yet loaded) handoff. The actor, agent, vehicle
        and vehicle-warehouse target are all resolved server-side; only the
        source warehouse, line items, notes and a client operationKey are
        accepted. Idempotent on operationKey — replaying the same key returns
        the same handoff, while a payload mismatch on replay yields 409. No
        inventory is mutated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleHandoffInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleHandoffDetail" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Conflicting state or idempotency payload mismatch
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/handoffs/{handoffId}:
    get:
      operationId: getVehicleHandoff
      tags: [vehicle-distribution]
      summary: Read a single handoff for the pilot vehicle
      parameters:
        - name: handoffId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleHandoffDetail" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or handoff not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/handoffs/{handoffId}/labels/prepare:
    post:
      operationId: prepareVehicleHandoffLabels
      tags: [vehicle-distribution]
      summary: Prepare printable production-label passports for a prepared handoff
      description: >-
        Idempotently materialises one production_labels passport + one
        vehicle_label_claim + one label_prepared unit event per physical unit of
        a handoff in status 'prepared'. Requires PRODUCTION_LABELS_SCHEMA_APPROVED
        at request time (503 otherwise). Strict {operationKey} body. Barcodes are
        generated server-side (TS only). Replaying the same handoff + key +
        fingerprint returns the existing payload; a different key on the same
        handoff, the same key on another handoff, or a payload/fingerprint
        mismatch yields 409. No inventory is mutated.
      parameters:
        - name: handoffId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleHandoffOperationInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleHandoffLabelsPayload" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or handoff not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Wrong state or idempotency conflict
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema (vehicle or production labels) not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/handoffs/{handoffId}/labels:
    get:
      operationId: getVehicleHandoffLabels
      tags: [vehicle-distribution]
      summary: Read the immutable printable label payload for a handoff
      description: >-
        Returns the deterministic, ordered print payload (persisted barcodes +
        all passport fields required by the PDF generator + print metadata) for a
        handoff whose labels have been prepared. Requires
        PRODUCTION_LABELS_SCHEMA_APPROVED at request time (503 otherwise).
      parameters:
        - name: handoffId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleHandoffLabelsPayload" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled, handoff not found, or labels not prepared
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema (vehicle or production labels) not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/handoffs/{handoffId}/confirm-labels-printed:
    post:
      operationId: confirmVehicleHandoffLabelsPrinted
      tags: [vehicle-distribution]
      summary: Confirm labels printed (first print or reprint) for a handoff
      description: >-
        Owns the full print-session contract. Requires
        PRODUCTION_LABELS_SCHEMA_APPROVED at request time (503 otherwise). Strict
        {operationKey} body. If a print session already exists for this
        operationKey on this handoff, returns the current payload with no
        increment. A first successful confirm on a 'prepared' handoff inserts a
        print session, marks each production_label printed (print_count +1,
        last_printed_at), advances claims prepared→printed, records idempotent
        label_printed events, and advances the handoff to labels_printed. A
        reprint confirm (allowed in labels_printed / handed_over /
        stock_transferred) inserts a reprint session and increments each passport
        once per NEW session, leaving handoff and loaded/sold claim states
        untouched. Reports isReprint and atLeastOnce (never claims exactly-once
        physical print). Cancelled/void/missing/mismatch yield 409.
      parameters:
        - name: handoffId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleHandoffOperationInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleHandoffConfirmLabelsResult" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or handoff not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Wrong state or claim invariant not satisfied
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/handoffs/{handoffId}/handed-over:
    post:
      operationId: markVehicleHandoffHandedOver
      tags: [vehicle-distribution]
      summary: Transition labels_printed to handed_over
      description: >-
        Exact labels_printed → handed_over transition. Server actor/timestamp;
        no stock movement. Same-state retry is idempotent.
      parameters:
        - name: handoffId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleHandoffTransitionInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleHandoffDetail" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or handoff not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Wrong state
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/handoffs/{handoffId}/stock-transferred:
    post:
      operationId: markVehicleHandoffStockTransferred
      tags: [vehicle-distribution]
      summary: Transition handed_over to stock_transferred (moves inventory)
      description: >-
        Exact handed_over → stock_transferred transition. Atomically moves
        physical stock from the source warehouse to the vehicle warehouse:
        verifies exact snapshot quantity and total weight are available (no
        GREATEST masking), subtracts source and adds vehicle, writes one
        stock_movements ledger row per item with a deterministic per-item
        reference and a batch movement_reference, marks claims loaded, records
        idempotent load unit events, then sets the terminal state. Any failure
        rolls back the whole transaction. Same-state retry is idempotent.
      parameters:
        - name: handoffId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleHandoffTransitionInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleHandoffDetail" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or handoff not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Wrong state, claim invariant, or insufficient stock/weight
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/handoffs/{handoffId}/cancel:
    post:
      operationId: cancelVehicleHandoff
      tags: [vehicle-distribution]
      summary: Cancel a pre-terminal handoff
      description: >-
        Cancels a handoff in any pre-terminal state (prepared, labels_printed,
        handed_over). Rejected once stock_transferred. No stock is mutated.
        Same cancelled-state retry is idempotent.
      parameters:
        - name: handoffId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleHandoffTransitionInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleHandoffDetail" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or handoff not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Already terminal (stock_transferred)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── Vehicle Distribution (F2 pilot) ─────────────────────────────
    VehicleDistributionBootstrapInput:
      type: object
      description: >-
        Bootstrap carries no overridable fields — all pilot constants (agent
        NAVRUZBEK, vehicle DM-001, type DAMAS) are fixed server-side. This
        object exists so the endpoint has a typed (empty) body contract.
      properties: {}
      additionalProperties: false

    VehicleDistributionAgent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required: [id, name]

    VehicleDistributionVehicle:
      type: object
      properties:
        id:
          type: integer
        plateNumber:
          type: string
        vehicleType:
          type: string
        status:
          type: string
        capacityKg:
          type: ["number", "null"]
        warehouseId:
          type: integer
      required: [id, plateNumber, vehicleType, status, capacityKg, warehouseId]

    VehicleDistributionWarehouse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        locationType:
          type: string
        purpose:
          type: string
        active:
          type: boolean
      required: [id, name, locationType, purpose, active]

    VehicleDistributionBalanceSummary:
      type: object
      description: Public warehouse balance summary for the vehicle's home warehouse.
      properties:
        warehouseId:
          type: integer
        skuCount:
          type: integer
        totalQuantity:
          type: number
        totalWeightKg:
          type: number
      required: [warehouseId, skuCount, totalQuantity, totalWeightKg]

    VehicleDistributionAssignment:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        deliveryAgentId:
          type: integer
        status:
          type: string
        assignedAt:
          type: ["string", "null"]
      required: [id, vehicleId, deliveryAgentId, status, assignedAt]

    VehicleDistributionPilot:
      type: object
      properties:
        bootstrapped:
          type: boolean
        agent:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionAgent"
            - type: "null"
        vehicle:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionVehicle"
            - type: "null"
        warehouse:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionWarehouse"
            - type: "null"
        balance:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionBalanceSummary"
            - type: "null"
        assignment:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionAssignment"
            - type: "null"
      required: [bootstrapped, agent, vehicle, warehouse, balance, assignment]

    # ── Vehicle Distribution (F5 read models) ───────────────────────
    VehicleDistributionPilotStockItem:
      type: object
      description: >-
        One stock card line for the pilot vehicle warehouse. productSku is
        nullable (and may be an empty string) because a matching catalog product
        may not exist for a raw inventory row.
      properties:
        product:
          type: string
        productName:
          type: string
        productSku:
          type: ["string", "null"]
        quantity:
          type: number
        weightKg:
          type: number
        updatedAt:
          type: ["string", "null"]
      required: [product, productName, productSku, quantity, weightKg, updatedAt]

    VehicleDistributionPilotStock:
      type: object
      description: >-
        Read model of the pilot vehicle warehouse stock. When not bootstrapped,
        vehicle and warehouse are null, items is empty, and every total is zero.
        Stock items include only nonzero-quantity rows, sorted by productName.
      properties:
        bootstrapped:
          type: boolean
        vehicle:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionVehicle"
            - type: "null"
        warehouse:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionWarehouse"
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/VehicleDistributionPilotStockItem"
        skuCount:
          type: integer
        totalQuantity:
          type: number
        totalWeightKg:
          type: number
      required:
        - bootstrapped
        - vehicle
        - warehouse
        - items
        - skuCount
        - totalQuantity
        - totalWeightKg

    VehicleDistributionPilotMovement:
      type: object
      description: >-
        One stock movement touching the pilot vehicle warehouse (as source or
        destination).
      properties:
        id:
          type: integer
        product:
          type: string
        quantity:
          type: number
        weightKg:
          type: ["number", "null"]
        movementType:
          type: string
        fromWarehouseId:
          type: ["integer", "null"]
        fromWarehouseName:
          type: ["string", "null"]
        toWarehouseId:
          type: ["integer", "null"]
        toWarehouseName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        createdBy:
          type: ["string", "null"]
        reference:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - product
        - quantity
        - weightKg
        - movementType
        - fromWarehouseId
        - fromWarehouseName
        - toWarehouseId
        - toWarehouseName
        - note
        - createdBy
        - reference
        - createdAt

    VehicleDistributionPilotMovements:
      type: object
      description: >-
        Keyset-paginated read model of movements touching the pilot vehicle
        warehouse. When not bootstrapped, items is empty and nextBeforeId is
        null.
      properties:
        bootstrapped:
          type: boolean
        vehicleWarehouseId:
          type: ["integer", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/VehicleDistributionPilotMovement"
        nextBeforeId:
          type: ["integer", "null"]
      required: [bootstrapped, vehicleWarehouseId, items, nextBeforeId]

    # ── Vehicle Distribution (F3 handoff) ───────────────────────────
    CreateVehicleHandoffItemInput:
      type: object
      description: A requested handoff line — a distribution product and the
        positive integer number of physical units to dispatch.
      properties:
        mahsulotId:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required: [mahsulotId, quantity]
      additionalProperties: false

    CreateVehicleHandoffInput:
      type: object
      description: >-
        Strict prepared-handoff creation body. Only these fields are accepted;
        agent, vehicle and vehicle-warehouse targets plus the actor are all
        resolved server-side. operationKey is a required client idempotency
        token.
      properties:
        sourceWarehouseId:
          type: integer
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateVehicleHandoffItemInput"
        notes:
          type: ["string", "null"]
        operationKey:
          type: string
          minLength: 1
      required: [sourceWarehouseId, items, operationKey]
      additionalProperties: false

    VehicleHandoffTransitionInput:
      type: object
      description: >-
        Lifecycle transition body. Carries no overridable fields — actor and
        timestamps are server-assigned. Exists so transitions have a typed
        (empty) body contract.
      properties: {}
      additionalProperties: false

    VehicleHandoffItem:
      type: object
      properties:
        id:
          type: integer
        mahsulotId:
          type: integer
        sku:
          type: string
        productName:
          type: ["string", "null"]
        quantity:
          type: integer
        unitWeightKg:
          type: ["number", "null"]
        totalWeightKg:
          type: ["number", "null"]
      required: [id, mahsulotId, sku, productName, quantity, unitWeightKg, totalWeightKg]

    VehicleHandoffDetail:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        deliveryAgentId:
          type: integer
        sourceWarehouseId:
          type: integer
        vehicleWarehouseId:
          type: integer
        handoffDate:
          type: string
        status:
          type: string
        operationKey:
          type: ["string", "null"]
        movementReference:
          type: ["string", "null"]
        preparedActorType:
          type: ["string", "null"]
        preparedActorRef:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        labelsPrintedAt:
          type: ["string", "null"]
        handedOverAt:
          type: ["string", "null"]
        stockTransferredAt:
          type: ["string", "null"]
        cancelledAt:
          type: ["string", "null"]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/VehicleHandoffItem"
      required:
        - id
        - vehicleId
        - deliveryAgentId
        - sourceWarehouseId
        - vehicleWarehouseId
        - handoffDate
        - status
        - operationKey
        - movementReference
        - preparedActorType
        - preparedActorRef
        - notes
        - labelsPrintedAt
        - handedOverAt
        - stockTransferredAt
        - cancelledAt
        - createdAt
        - items

    VehicleHandoffList:
      type: object
      properties:
        vehicleId:
          type: integer
        handoffs:
          type: array
          items:
            $ref: "#/components/schemas/VehicleHandoffDetail"
      required: [vehicleId, handoffs]

    VehicleHandoffOperationInput:
      type: object
      description: >-
        Strict operation body for F4 label prepare/confirm. Carries only a
        required client idempotency operationKey; all other authority is
        resolved server-side.
      properties:
        operationKey:
          type: string
          minLength: 1
      required: [operationKey]
      additionalProperties: false

    VehicleHandoffLabelPassport:
      type: object
      description: >-
        One immutable production-label passport row for a single physical unit,
        carrying every field the PDF generator needs plus print metadata.
      properties:
        productionLabelId:
          type: integer
        handoffItemId:
          type: integer
        mahsulotId:
          type: integer
        barcodeValue:
          type: string
        batchCode:
          type: string
        labelType:
          type: string
        labelNumber:
          type: integer
        totalLabels:
          type: integer
        piecesInLabel:
          type: integer
        piecesPerBox:
          type: integer
        quantityTotal:
          type: integer
        weightKg:
          type: number
        lengthM:
          type: ["number", "null"]
        productName:
          type: string
        productSku:
          type: string
        workerName:
          type: string
        producedAt:
          type: string
        warehouseId:
          type: ["integer", "null"]
        warehouseName:
          type: string
        status:
          type: string
        printCount:
          type: integer
        lastPrintedAt:
          type: ["string", "null"]
      required:
        - productionLabelId
        - handoffItemId
        - mahsulotId
        - barcodeValue
        - batchCode
        - labelType
        - labelNumber
        - totalLabels
        - piecesInLabel
        - piecesPerBox
        - quantityTotal
        - weightKg
        - lengthM
        - productName
        - productSku
        - workerName
        - producedAt
        - warehouseId
        - warehouseName
        - status
        - printCount
        - lastPrintedAt
      additionalProperties: false

    VehicleHandoffLabelsPayload:
      type: object
      description: >-
        Deterministic, ordered printable label payload for a handoff. labels are
        globally ordered by label_number (1..totalLabels).
      properties:
        handoffId:
          type: integer
        vehicleId:
          type: integer
        batchCode:
          type: string
        totalLabels:
          type: integer
        preparedActorType:
          type: ["string", "null"]
        preparedActorRef:
          type: ["string", "null"]
        labels:
          type: array
          items:
            $ref: "#/components/schemas/VehicleHandoffLabelPassport"
      required:
        - handoffId
        - vehicleId
        - batchCode
        - totalLabels
        - preparedActorType
        - preparedActorRef
        - labels
      additionalProperties: false

    VehicleHandoffConfirmLabelsResult:
      type: object
      description: >-
        Result of a confirm-labels-printed call. isReprint indicates the confirm
        was a reprint; atLeastOnce is always true on success and intentionally
        does NOT claim exactly-once physical printing.
      properties:
        handoff:
          $ref: "#/components/schemas/VehicleHandoffDetail"
        labels:
          $ref: "#/components/schemas/VehicleHandoffLabelsPayload"
        isReprint:
          type: boolean
        atLeastOnce:
          type: boolean
      required: [handoff, labels, isReprint, atLeastOnce]
      additionalProperties: false

    # ── Auth ────────────────────────────────────────────────────────
    LoginInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    LoginResult:
      type: object
      properties:
        ok:
          type: boolean
        user:
          $ref: "#/components/schemas/AdminUser"
      required: [ok, user]

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
