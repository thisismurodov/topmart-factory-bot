openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TopMart ERP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: batches
  - name: production-labels
  - name: workers
  - name: products
  - name: salary
  - name: payroll
  - name: customers
  - name: sales
  - name: inventory
  - name: vehicle-distribution

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: Healthy

  # ── Auth ──────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current session user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ─────────────────────────────────────────────────────────
  /dashboard/today:
    get:
      operationId: getDashboardToday
      tags: [dashboard]
      summary: Today's summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardToday"

  /dashboard/monthly:
    get:
      operationId: getDashboardMonthly
      tags: [dashboard]
      summary: Monthly summary
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMonthly"

  /dashboard/top-workers:
    get:
      operationId: getTopWorkers
      tags: [dashboard]
      summary: Top workers this month
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerStat"

  /dashboard/daily-chart:
    get:
      operationId: getDailyChart
      tags: [dashboard]
      summary: Daily production chart (last 30 days)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyChartPoint"

  # ── Batches ───────────────────────────────────────────────────────────
  /batches:
    get:
      operationId: getBatches
      tags: [batches]
      summary: List batches
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
        - name: worker
          in: query
          schema:
            type: ["string", "null"]
        - name: product
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchList"

  /batches/{id}:
    delete:
      operationId: deleteBatch
      tags: [batches]
      summary: Delete a batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /production-labels/{barcode}:
    get:
      operationId: getProductionLabel
      tags: [production-labels]
      summary: Look up one physical production label passport
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
            pattern: "^TM[A-Z2-7]{16}$"
      responses:
        "200":
          description: Label passport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionLabelPassport"
        "400":
          description: Invalid barcode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Workers ───────────────────────────────────────────────────────────
  /workers:
    get:
      operationId: getWorkers
      tags: [workers]
      summary: List all workers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"

    post:
      operationId: createWorker
      tags: [workers]
      summary: Add worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /workers/update:
    put:
      operationId: updateWorker
      tags: [workers]
      summary: Update worker (rename + edit fields)
      description: >-
        Identifies the worker by currentName in the body (not the URL) so that
        workers with names that are empty, ".", or contain "/" can still be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerUpdateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /workers/delete:
    post:
      operationId: deleteWorker
      tags: [workers]
      summary: Delete worker
      description: >-
        Identifies the worker by name in the body (not the URL) so that workers
        with names that are empty, ".", or contain "/" can still be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerDeleteInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Products ──────────────────────────────────────────────────────────
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

    post:
      operationId: createProduct
      tags: [products]
      summary: Add product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{name}:
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Salary ────────────────────────────────────────────────────────────
  /salary/report:
    get:
      operationId: getSalaryReport
      tags: [salary]
      summary: Monthly salary report
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryRow"

  /salary/pay:
    post:
      operationId: markSalaryPaid
      tags: [salary]
      summary: Mark worker salary as paid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalaryPayInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Payroll (rolga asoslangan kg maosh) ───────────────────────────────
  /payroll/role-rates:
    get:
      operationId: getPayrollRoleRates
      tags: [payroll]
      summary: List role rates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollRoleRate"
    put:
      operationId: updatePayrollRoleRate
      tags: [payroll]
      summary: Update a role rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollRoleRateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRoleRate"

  /payroll/workers:
    get:
      operationId: getKgPayrollWorkers
      tags: [payroll]
      summary: List assigned kg payroll workers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KgPayrollWorker"
    post:
      operationId: assignKgPayrollWorker
      tags: [payroll]
      summary: Assign a worker to the kg payroll pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KgPayrollWorkerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KgPayrollWorker"

  /payroll/workers/{id}:
    delete:
      operationId: removeKgPayrollWorker
      tags: [payroll]
      summary: Remove a kg payroll assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /payroll/worker-earnings:
    get:
      operationId: getPayrollWorkerEarnings
      tags: [payroll]
      summary: Per-worker today/month/lifetime earnings and kg
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollWorkerEarnings"

  /payroll/day-status:
    get:
      operationId: getPayrollDayStatus
      tags: [payroll]
      summary: Today's day-close status and producer volume
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollDayStatus"

  /payroll/lines:
    get:
      operationId: getProductionLines
      tags: [payroll]
      summary: List production lines
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionLine"
    post:
      operationId: createProductionLine
      tags: [payroll]
      summary: Create a production line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionLineInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionLine"

  /payroll/lines/{id}:
    delete:
      operationId: deleteProductionLine
      tags: [payroll]
      summary: Delete a production line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /payroll/lines/{id}/workers:
    post:
      operationId: addProductionLineWorker
      tags: [payroll]
      summary: Add a worker to a production line (enforces per-role limits)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionLineWorkerInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionLineWorker"

  /payroll/line-workers/{id}:
    delete:
      operationId: removeProductionLineWorker
      tags: [payroll]
      summary: Remove a worker from a production line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /payroll/close-day:
    post:
      operationId: closePayrollDay
      tags: [payroll]
      summary: Close today's payroll for all lines (idempotent per line+date)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollCloseResult"

  # ── Customers ─────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: getCustomers
      tags: [customers]
      summary: List customers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"

    post:
      operationId: createCustomer
      tags: [customers]
      summary: Add customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Sales ─────────────────────────────────────────────────────────────
  /sales:
    get:
      operationId: getSales
      tags: [sales]
      summary: List sales
      parameters:
        - name: customerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleList"

    post:
      operationId: createSale
      tags: [sales]
      summary: Create sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{id}:
    delete:
      operationId: deleteSale
      tags: [sales]
      summary: Delete sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sales/{id}/status:
    patch:
      operationId: updateSaleStatus
      tags: [sales]
      summary: Update sale payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleStatusInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Inventory ─────────────────────────────────────────────────────────
  /inventory:
    get:
      operationId: getInventory
      tags: [inventory]
      summary: Current inventory (produced minus sold)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  # ── Vehicle Distribution (F2 pilot) ───────────────────────────────────
  /vehicle-distribution/pilot:
    get:
      operationId: getVehicleDistributionPilot
      tags: [vehicle-distribution]
      summary: Read the pilot vehicle, warehouse balance summary and active assignment
      description: >-
        Authenticated read-only view of the single pilot vehicle (DM-001 / DAMAS),
        its home warehouse balance summary, and the active agent assignment.
        Fails closed (404) unless the vehicle-distribution feature is enabled, and
        returns 503 when enabled without schema approval. When the pilot has not
        been bootstrapped, returns a deterministic not-bootstrapped payload without
        performing any writes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDistributionPilot"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Enabled but schema not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicle-distribution/pilot/weekly-summary:
    get:
      operationId: getVehicleDistributionPilotWeeklySummary
      tags: [vehicle-distribution]
      summary: Read exact-pilot weekly reconciliation and readiness
      description: >-
        Admin-session-only, SELECT-only weekly operational reconciliation for
        the exact pilot. weekStart must be a non-future Monday civil date. When
        omitted it defaults to the current Monday in fixed +05:00. The interval
        is half-open from Monday 00:00+05:00 through the following Monday.
        Current weeks require daily F6 coverage through today +05:00 inclusive;
        completed weeks require all seven days. A valid vehicle bot key and
        non-admin sessions are explicitly forbidden.
      parameters:
        - name: weekStart
          in: query
          required: false
          description: Monday civil date; defaults to current +05:00 Monday.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Weekly reconciliation/readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehiclePilotWeeklySummary"
        "400":
          description: Invalid date, non-Monday, or future week
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Missing or invalid admin session
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Admin session required
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or exact pilot unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/pilot/bootstrap:
    post:
      operationId: bootstrapVehicleDistributionPilot
      tags: [vehicle-distribution]
      summary: Idempotently create/reuse the pilot vehicle, warehouse and assignment
      description: >-
        Admin-only. Idempotently provisions the exact pilot state (agent NAVRUZBEK,
        vehicle DM-001 / DAMAS, one vehicle warehouse) and the single active
        assignment. All server constants are fixed; the request body carries no
        overridable fields. Retries and concurrent double-clicks return the same
        state with no duplicate rows.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleDistributionBootstrapInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDistributionPilot"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflicting or ambiguous existing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Enabled but schema not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicle-distribution/pilot/stock:
    get:
      operationId: getVehicleDistributionPilotStock
      tags: [vehicle-distribution]
      summary: Read the pilot vehicle warehouse stock cards (read model)
      description: >-
        Authenticated read-only stock view for the single pilot vehicle
        (DM-001 / DAMAS / agent NAVRUZBEK). The pilot vehicle and its expected
        vehicle warehouse are resolved entirely server-side — the request takes
        no vehicle or warehouse input. Fails closed (404) unless the
        vehicle-distribution feature is enabled, and returns 503 when enabled
        without schema approval. When the pilot has not been bootstrapped (no
        active NAVRUZBEK assignment on DM-001 with the exact expected vehicle
        warehouse), returns a deterministic not-bootstrapped payload
        (bootstrapped=false, null vehicle/warehouse, empty items, zeroed
        totals) and NEVER falls back to a generic warehouse. Stock items include
        only nonzero-quantity inventory rows (stock-card display semantics),
        sorted by product name.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDistributionPilotStock"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Enabled but schema not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicle-distribution/pilot/movements:
    get:
      operationId: getVehicleDistributionPilotMovements
      tags: [vehicle-distribution]
      summary: Read the pilot vehicle warehouse stock movements (read model)
      description: >-
        Authenticated read-only audit history of stock movements that touch the
        single pilot vehicle warehouse (either as source or destination). The
        pilot vehicle and its expected vehicle warehouse are resolved entirely
        server-side — the request takes no vehicle or warehouse input. Only rows
        where the pilot vehicle warehouse is the from OR to warehouse are ever
        returned; global movements and other-warehouse-only rows are never
        exposed. Ordered deterministically by id DESC and paginated via a
        keyset cursor (beforeId → nextBeforeId). Fails closed (404) unless the
        feature is enabled, 503 when enabled without schema approval. When the
        pilot has not been bootstrapped, returns a deterministic
        not-bootstrapped payload (bootstrapped=false, empty items, null
        nextBeforeId).
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of movements to return (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: beforeId
          in: query
          required: false
          description: >-
            Keyset cursor — return only movements with id strictly less than
            this positive integer. Omit for the first page.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDistributionPilotMovements"
        "400":
