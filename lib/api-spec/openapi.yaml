  /vehicle-distribution/pilot/reconciliations:
    get:
      operationId: listVehicleReconciliations
      tags: [vehicle-distribution]
      summary: List end-of-day reconciliations for the pilot vehicle
      description: >-
        Returns the reconciliation history for the single active pilot vehicle
        (server-resolved), newest first. Authenticated via the dedicated
        vehicle-distribution auth wall. Fails closed (404) unless enabled, 503
        when enabled without schema approval.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of reconciliations to return (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleReconciliationList" } } }
        "400":
          description: Invalid query parameters
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    post:
      operationId: createVehicleReconciliation
      tags: [vehicle-distribution]
      summary: Open a draft reconciliation snapshotting the pilot vehicle inventory
      description: >-
        Admin-only. Opens a new draft reconciliation for the single active pilot
        vehicle. The vehicle, warehouse, delivery agent and the actor
        (created_by) are all resolved server-side; the body carries only a
        reconciliation date and optional notes. Snapshots every COMPLETE nonzero
        product currently in the pilot vehicle warehouse, resolving each product
        name to exactly one active public.products row (409 on a missing or
        ambiguous match), recording expected quantity + weight snapshots with
        actual quantity left NULL until counted. No inventory, stock, claim or
        label state is mutated. Rejects an existing non-terminal reconciliation
        (draft/approved/disputed); replaying the same date while a draft already
        exists for it returns the existing draft with created=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleReconciliationInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleReconciliationCreateResult" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Admin role required
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Conflicting active reconciliation or unresolvable product
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/pilot/reconciliations/{reconciliationId}:
    get:
      operationId: getVehicleReconciliation
      tags: [vehicle-distribution]
      summary: Read a single reconciliation for the pilot vehicle
      parameters:
        - name: reconciliationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleReconciliationDetail" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or reconciliation not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/pilot/reconciliations/{reconciliationId}/items:
    patch:
      operationId: patchVehicleReconciliationItems
      tags: [vehicle-distribution]
      summary: Enter physical counts on a draft reconciliation's line items
      description: >-
        Admin-only. Records the physically counted actual quantity on one or
        more line items of a DRAFT reconciliation belonging to the pilot vehicle.
        Each entry carries an itemId and a finite nonnegative actualQuantity (and
        optional notes); the discrepancy is recomputed server-side and the
        counted_by / counted_at actor stamp is assigned server-side. Only draft
        reconciliations are editable. No inventory, stock, claim or label state
        is mutated.
      parameters:
        - name: reconciliationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchVehicleReconciliationItemsInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleReconciliationDetail" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Admin role required
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or reconciliation/item not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Reconciliation is not a draft
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/pilot/reconciliations/{reconciliationId}/review:
    post:
      operationId: reviewVehicleReconciliation
      tags: [vehicle-distribution]
      summary: Review a fully counted draft reconciliation (approved or disputed)
      description: >-
        Admin-only. Reviews a DRAFT reconciliation once every line has been
        counted (409 otherwise). If every line matches (all discrepancies zero)
        the reconciliation becomes 'approved'; any nonzero discrepancy makes it
        'disputed' (a terminal outcome). Records the reviewer + timestamp
        server-side. This is a label-preserving variance decision only — NO
        inventory, stock, claim, label or unit-event state is ever mutated.
        Strict empty body. Replaying against an already reviewed reconciliation
        is idempotent and returns the same outcome.
      parameters:
        - name: reconciliationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleReconciliationOperationInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleReconciliationDetail" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Admin role required
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or reconciliation not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Not all lines counted, or reconciliation not reviewable
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/pilot/reconciliations/{reconciliationId}/apply:
    post:
      operationId: applyVehicleReconciliation
      tags: [vehicle-distribution]
      summary: Finalize an approved reconciliation after re-verifying the snapshot
      description: >-
        Admin-only. Finalizes an APPROVED reconciliation. Re-locks the pilot
        vehicle inventory and re-compares the current COMPLETE nonzero rows
        against the snapshot; if any product was added, removed or changed since
        the snapshot the finalize is rejected as stale (409). On success the
        status becomes 'applied' with the actor + timestamp recorded. This is a
        label-preserving confirmation only — NO stock_movements, inventory,
        claim, label or unit-event state is ever mutated. Strict empty body.
        Replaying against an already applied reconciliation is idempotent.
      parameters:
        - name: reconciliationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleReconciliationOperationInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleReconciliationDetail" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Admin role required
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or reconciliation not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Not approved, or snapshot is stale
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /vehicle-distribution/pilot/reconciliations/{reconciliationId}/cancel:
    post:
      operationId: cancelVehicleReconciliation
      tags: [vehicle-distribution]
      summary: Cancel a draft reconciliation
      description: >-
        Admin-only. Cancels a DRAFT reconciliation for the pilot vehicle.
        Rejected once the reconciliation has left draft (approved / applied /
        disputed). No inventory is mutated. Strict empty body. Replaying against
        an already cancelled reconciliation is idempotent.
      parameters:
        - name: reconciliationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleReconciliationOperationInput"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/VehicleReconciliationDetail" } } }
        "400":
          description: Invalid body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Unauthorized
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Admin role required
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Feature disabled or reconciliation not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Reconciliation is not a draft
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Enabled but schema not approved
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── Vehicle Distribution (F2 pilot) ─────────────────────────────
    VehicleDistributionBootstrapInput:
      type: object
      description: >-
        Bootstrap carries no overridable fields — all pilot constants (agent
        NAVRUZBEK, vehicle DM-001, type DAMAS) are fixed server-side. This
        object exists so the endpoint has a typed (empty) body contract.
      properties: {}
      additionalProperties: false

    VehicleDistributionAgent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required: [id, name]

    VehicleDistributionVehicle:
      type: object
      properties:
        id:
          type: integer
        plateNumber:
          type: string
        vehicleType:
          type: string
        status:
          type: string
        capacityKg:
          type: ["number", "null"]
        warehouseId:
          type: integer
      required: [id, plateNumber, vehicleType, status, capacityKg, warehouseId]

    VehicleDistributionWarehouse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        locationType:
          type: string
        purpose:
          type: string
        active:
          type: boolean
      required: [id, name, locationType, purpose, active]

    VehicleDistributionBalanceSummary:
      type: object
      description: Public warehouse balance summary for the vehicle's home warehouse.
      properties:
        warehouseId:
          type: integer
        skuCount:
          type: integer
        totalQuantity:
          type: number
        totalWeightKg:
          type: number
      required: [warehouseId, skuCount, totalQuantity, totalWeightKg]

    VehicleDistributionAssignment:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        deliveryAgentId:
          type: integer
        status:
          type: string
        assignedAt:
          type: ["string", "null"]
      required: [id, vehicleId, deliveryAgentId, status, assignedAt]

    VehicleDistributionPilot:
      type: object
      properties:
        bootstrapped:
          type: boolean
        agent:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionAgent"
            - type: "null"
        vehicle:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionVehicle"
            - type: "null"
        warehouse:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionWarehouse"
            - type: "null"
        balance:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionBalanceSummary"
            - type: "null"
        assignment:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionAssignment"
            - type: "null"
      required: [bootstrapped, agent, vehicle, warehouse, balance, assignment]

    # ── Vehicle Distribution (F5 read models) ───────────────────────
    VehicleDistributionPilotStockItem:
      type: object
      description: >-
        One stock card line for the pilot vehicle warehouse. productSku is
        nullable (and may be an empty string) because a matching catalog product
        may not exist for a raw inventory row.
      properties:
        product:
          type: string
        productName:
          type: string
        productSku:
          type: ["string", "null"]
        quantity:
          type: number
        weightKg:
          type: number
        updatedAt:
          type: ["string", "null"]
      required: [product, productName, productSku, quantity, weightKg, updatedAt]

    VehicleDistributionPilotStock:
      type: object
      description: >-
        Read model of the pilot vehicle warehouse stock. When not bootstrapped,
        vehicle and warehouse are null, items is empty, and every total is zero.
        Stock items include only nonzero-quantity rows, sorted by productName.
      properties:
        bootstrapped:
          type: boolean
        vehicle:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionVehicle"
            - type: "null"
        warehouse:
          oneOf:
            - $ref: "#/components/schemas/VehicleDistributionWarehouse"
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/VehicleDistributionPilotStockItem"
        skuCount:
          type: integer
        totalQuantity:
          type: number
        totalWeightKg:
          type: number
      required:
        - bootstrapped
        - vehicle
        - warehouse
        - items
        - skuCount
        - totalQuantity
        - totalWeightKg

    VehicleWeeklyMetric:
      type: object
      properties:
        quantity: { type: number }
        weightKg: { type: number }
      required: [quantity, weightKg]

    VehicleWeeklyProduct:
      type: object
      properties:
        publicProductId: { type: integer }
        productName: { type: string }
        sku: { type: string }
        inventoryCurrent: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
        expectedCurrent: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
        handedBackReserved: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
        indeterminate: { type: boolean }
        eventNet: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
        movementNet: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
        expectedOpening: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
        inventoryOpening: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
        claimInventoryVariance:
          oneOf:
            - $ref: "#/components/schemas/VehicleWeeklyMetric"
            - type: "null"
        movementEventVariance: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
      required:
        - publicProductId
        - productName
        - sku
        - inventoryCurrent
        - expectedCurrent
        - handedBackReserved
        - indeterminate
        - eventNet
        - movementNet
        - expectedOpening
        - inventoryOpening
        - claimInventoryVariance
        - movementEventVariance

    VehicleCivilDate:
      type: string
      description: Civil calendar date preserved exactly as YYYY-MM-DD; never serialized as a timestamp.
      pattern: '^\d{4}-\d{2}-\d{2}$'
      minLength: 10
      maxLength: 10

    VehicleWeeklyDay:
      type: object
      properties:
        date: { $ref: "#/components/schemas/VehicleCivilDate" }
        reconciliationId: { type: ["integer", "null"] }
        status: { type: string }
        allCounted: { type: boolean }
        discrepancyCount: { type: integer }
        discrepancyQuantity: { type: number }
        missing: { type: boolean }
      required: [date, reconciliationId, status, allCounted, discrepancyCount, discrepancyQuantity, missing]

    VehicleWeeklyBlockerDetail:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        message: { type: string }
      required: [id, status, message]

    VehicleWeeklyBlocker:
      type: object
      properties:
        type: { type: string }
        totalCount: { type: integer }
        details:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/VehicleWeeklyBlockerDetail" }
        truncated: { type: boolean }
      required: [type, totalCount, details, truncated]

    VehiclePilotWeeklySummary:
      type: object
      properties:
        readiness: { type: boolean }
        reasons:
          type: array
          items: { type: string }
        week:
          type: object
          properties:
            weekStart: { $ref: "#/components/schemas/VehicleCivilDate" }
            weekEndExclusive: { $ref: "#/components/schemas/VehicleCivilDate" }
            utcStart: { type: string, format: date-time }
            utcEndExclusive: { type: string, format: date-time }
            timezone: { type: string, const: "+05:00" }
            currentWeek: { type: boolean }
            defaultedWeekStart: { type: boolean }
            requiredThroughDate: { $ref: "#/components/schemas/VehicleCivilDate" }
            requiredDayCount: { type: integer }
          required: [weekStart, weekEndExclusive, utcStart, utcEndExclusive, timezone, currentWeek, defaultedWeekStart, requiredThroughDate, requiredDayCount]
        tolerances:
          type: object
          properties:
            quantity: { type: number }
            weightKg: { type: number }
          required: [quantity, weightKg]
        kpis:
          type: object
          properties:
            productCount: { type: integer }
            inventoryCurrent: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
            expectedCurrent: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
            eventNet: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
            movementNet: { $ref: "#/components/schemas/VehicleWeeklyMetric" }
            requiredDays: { type: integer }
            appliedDays: { type: integer }
            blockerCount: { type: integer }
          required: [productCount, inventoryCurrent, expectedCurrent, eventNet, movementNet, requiredDays, appliedDays, blockerCount]
        products:
          type: array
          items: { $ref: "#/components/schemas/VehicleWeeklyProduct" }
        days:
          type: array
          items: { $ref: "#/components/schemas/VehicleWeeklyDay" }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/VehicleWeeklyBlocker" }
      required: [readiness, reasons, week, tolerances, kpis, products, days, blockers]

    VehicleDistributionPilotMovement:
      type: object
      description: >-
        One stock movement touching the pilot vehicle warehouse (as source or
        destination).
      properties:
        id:
          type: integer
        product:
          type: string
        quantity:
          type: number
        weightKg:
          type: ["number", "null"]
        movementType:
          type: string
        fromWarehouseId:
          type: ["integer", "null"]
        fromWarehouseName:
          type: ["string", "null"]
        toWarehouseId:
          type: ["integer", "null"]
        toWarehouseName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        createdBy:
          type: ["string", "null"]
        reference:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - product
        - quantity
        - weightKg
        - movementType
        - fromWarehouseId
        - fromWarehouseName
        - toWarehouseId
        - toWarehouseName
        - note
        - createdBy
        - reference
        - createdAt

    VehicleDistributionPilotMovements:
      type: object
      description: >-
        Keyset-paginated read model of movements touching the pilot vehicle
        warehouse. When not bootstrapped, items is empty and nextBeforeId is
        null.
      properties:
        bootstrapped:
          type: boolean
        vehicleWarehouseId:
          type: ["integer", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/VehicleDistributionPilotMovement"
        nextBeforeId:
          type: ["integer", "null"]
      required: [bootstrapped, vehicleWarehouseId, items, nextBeforeId]

    # ── Vehicle Distribution (F3 handoff) ───────────────────────────
    CreateVehicleHandoffItemInput:
      type: object
      description: A requested handoff line — a distribution product and the
        positive integer number of physical units to dispatch.
      properties:
        mahsulotId:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required: [mahsulotId, quantity]
      additionalProperties: false

    CreateVehicleHandoffInput:
      type: object
      description: >-
        Strict prepared-handoff creation body. Only these fields are accepted;
        agent, vehicle and vehicle-warehouse targets plus the actor are all
        resolved server-side. operationKey is a required client idempotency
        token.
      properties:
        sourceWarehouseId:
          type: integer
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateVehicleHandoffItemInput"
        notes:
          type: ["string", "null"]
        operationKey:
          type: string
          minLength: 1
      required: [sourceWarehouseId, items, operationKey]
      additionalProperties: false

    VehicleHandoffTransitionInput:
      type: object
      description: >-
        Lifecycle transition body. Carries no overridable fields — actor and
        timestamps are server-assigned. Exists so transitions have a typed
        (empty) body contract.
      properties: {}
      additionalProperties: false

    VehicleHandoffItem:
      type: object
      properties:
        id:
          type: integer
        mahsulotId:
          type: integer
        sku:
          type: string
        productName:
          type: ["string", "null"]
        quantity:
          type: integer
        unitWeightKg:
          type: ["number", "null"]
        totalWeightKg:
          type: ["number", "null"]
      required: [id, mahsulotId, sku, productName, quantity, unitWeightKg, totalWeightKg]

    VehicleHandoffDetail:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        deliveryAgentId:
          type: integer
        sourceWarehouseId:
          type: integer
        vehicleWarehouseId:
          type: integer
        handoffDate:
          type: string
        status:
          type: string
        operationKey:
          type: ["string", "null"]
        movementReference:
          type: ["string", "null"]
        preparedActorType:
          type: ["string", "null"]
        preparedActorRef:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        labelsPrintedAt:
          type: ["string", "null"]
        handedOverAt:
          type: ["string", "null"]
        stockTransferredAt:
          type: ["string", "null"]
        cancelledAt:
          type: ["string", "null"]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/VehicleHandoffItem"
      required:
        - id
        - vehicleId
        - deliveryAgentId
        - sourceWarehouseId
        - vehicleWarehouseId
        - handoffDate
        - status
        - operationKey
        - movementReference
        - preparedActorType
        - preparedActorRef
        - notes
        - labelsPrintedAt
        - handedOverAt
        - stockTransferredAt
        - cancelledAt
        - createdAt
        - items

    VehicleHandoffList:
      type: object
      properties:
        vehicleId:
          type: integer
        handoffs:
          type: array
          items:
            $ref: "#/components/schemas/VehicleHandoffDetail"
      required: [vehicleId, handoffs]

    VehicleHandoffOperationInput:
      type: object
      description: >-
        Strict operation body for F4 label prepare/confirm. Carries only a
        required client idempotency operationKey; all other authority is
        resolved server-side.
      properties:
        operationKey:
          type: string
          minLength: 1
      required: [operationKey]
      additionalProperties: false

    VehicleHandoffLabelPassport:
      type: object
      description: >-
        One immutable production-label passport row for a single physical unit,
        carrying every field the PDF generator needs plus print metadata.
      properties:
        productionLabelId:
          type: integer
        handoffItemId:
          type: integer
        mahsulotId:
          type: integer
        barcodeValue:
          type: string
        batchCode:
          type: string
        labelType:
          type: string
        labelNumber:
          type: integer
        totalLabels:
          type: integer
        piecesInLabel:
          type: integer
        piecesPerBox:
          type: integer
        quantityTotal:
          type: integer
        weightKg:
          type: number
        lengthM:
          type: ["number", "null"]
        productName:
          type: string
        productSku:
          type: string
        workerName:
          type: string
        producedAt:
          type: string
        warehouseId:
          type: ["integer", "null"]
        warehouseName:
          type: string
        status:
          type: string
        printCount:
          type: integer
        lastPrintedAt:
          type: ["string", "null"]
      required:
        - productionLabelId
        - handoffItemId
        - mahsulotId
        - barcodeValue
        - batchCode
        - labelType
        - labelNumber
        - totalLabels
        - piecesInLabel
        - piecesPerBox
        - quantityTotal
        - weightKg
        - lengthM
        - productName
        - productSku
        - workerName
        - producedAt
        - warehouseId
        - warehouseName
        - status
        - printCount
        - lastPrintedAt
      additionalProperties: false

    VehicleHandoffLabelsPayload:
      type: object
      description: >-
        Deterministic, ordered printable label payload for a handoff. labels are
        globally ordered by label_number (1..totalLabels).
      properties:
        handoffId:
          type: integer
        vehicleId:
          type: integer
        batchCode:
          type: string
        totalLabels:
          type: integer
        preparedActorType:
          type: ["string", "null"]
        preparedActorRef:
          type: ["string", "null"]
        labels:
          type: array
          items:
            $ref: "#/components/schemas/VehicleHandoffLabelPassport"
      required:
        - handoffId
        - vehicleId
        - batchCode
        - totalLabels
        - preparedActorType
        - preparedActorRef
        - labels
      additionalProperties: false

    VehicleHandoffConfirmLabelsResult:
      type: object
      description: >-
        Result of a confirm-labels-printed call. isReprint indicates the confirm
        was a reprint; atLeastOnce is always true on success and intentionally
        does NOT claim exactly-once physical printing.
      properties:
        handoff:
          $ref: "#/components/schemas/VehicleHandoffDetail"
        labels:
          $ref: "#/components/schemas/VehicleHandoffLabelsPayload"
        isReprint:
          type: boolean
        atLeastOnce:
          type: boolean
      required: [handoff, labels, isReprint, atLeastOnce]
      additionalProperties: false

    # ── Vehicle Reconciliation (F6 variance detection) ──────────────
    ReplaceVehicleStockTargetInput:
      type: object
      additionalProperties: false
      required: [mahsulotId, minQuantity, targetQuantity, operationKey]
      properties:
        mahsulotId: { type: integer, minimum: 1 }
        minQuantity: { type: integer, minimum: 0 }
        targetQuantity: { type: integer, minimum: 1 }
        operationKey: { type: string, minLength: 1, maxLength: 200 }
        effectiveFrom: { type: string, format: date }

    VehicleStockTarget:
      type: object
      additionalProperties: false
      required: [id, vehicleId, mahsulotId, publicProductId, productName, sku,
        minQuantity, targetQuantity, currentQuantity, deficitQuantity, low,
        effectiveFrom, effectiveTo, operationKey, actorType, actorRef, createdAt]
      properties:
        id: { type: integer }
        vehicleId: { type: integer }
        mahsulotId: { type: integer }
        publicProductId: { type: integer }
        productName: { type: string }
        sku: { type: string }
        minQuantity: { type: number }
